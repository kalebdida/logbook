name: tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # GitHub's Ubuntu runners come with PostgreSQL installed (stopped). Using
      # it instead of a Docker service means no Docker Hub pull that can fail.
      - name: start postgres
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 20); do pg_isready && break; sleep 1; done
          sudo -u postgres psql -c "CREATE USER logbook WITH PASSWORD 'logbook';"
          sudo -u postgres psql -c "CREATE DATABASE logbook_test OWNER logbook;"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: sqlite
        working-directory: backend
        run: python -m pytest -q
      - name: postgres
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://logbook:logbook@localhost:5432/logbook_test
        run: python -m pytest -q
