name: tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: logbook
          POSTGRES_PASSWORD: logbook
          POSTGRES_DB: logbook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logbook" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: sqlite
        working-directory: backend
        run: python -m pytest -q
      - name: postgres
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://logbook:logbook@localhost:5432/logbook_test
        run: python -m pytest -q
