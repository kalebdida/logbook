# Builds an installable Android APK in the cloud: no Android Studio needed.
# Run it from the Actions tab ("Run workflow"), or push a tag like v2.1.0.
# Download the APK from the run's "Artifacts" section, copy it to your
# phone, and open it (allow "install unknown apps" for your file manager).
name: android apk

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# a tag also publishes the APK as a GitHub release: a plain download link,
# no login needed
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: python scripts/build_web.py
        env:
          LOGBOOK_API_URL: ${{ vars.LOGBOOK_API_URL || 'https://logbook-lt30.onrender.com' }}
      - run: npx cap add android
      - name: app icon and splash screen
        run: npm run android:icons
        continue-on-error: true
      - run: npx cap sync android
      - name: build debug apk
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: logbook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: publish the APK on the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "logbook-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "logbook-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "Logbook $GITHUB_REF_NAME" \
            --notes "Android app. Download the .apk on your phone, open it, and allow installing from your browser or file manager. It connects to your Logbook server and asks you to log in. The web version is at https://kalebdida.github.io/logbook/"
