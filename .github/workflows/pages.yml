# Publishes the web app to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Until that's done, this workflow skips the deploy with a note instead of
# failing (so it doesn't email you a failure on every push).
# With the repo variable LOGBOOK_API_URL set (Settings → Secrets and
# variables → Actions → Variables), the Pages copy is the front door to that
# server: a first visit connects to it by itself. Without it, the Pages copy
# runs in device mode (data stays in each browser) and can connect to a
# server from settings.
name: web app (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "::notice title=GitHub Pages is off::Turn it on once: repo Settings → Pages → Source: GitHub Actions. Then re-run this workflow (or push). Skipping the deploy for now."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            # 200 (on), or anything unexpected: try the deploy and let it report
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/build_web.py
        env:
          LOGBOOK_API_URL: ${{ 'https://logbook-fra.onrender.com' }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
