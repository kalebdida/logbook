# Clears old red marks from the Actions tab: deletes failed or cancelled runs
# that a later successful run of the same workflow has already fixed. A
# failure that hasn't been fixed yet is left alone, so real problems still
# show. Runs once when this file changes, and any time from the Actions tab
# ("Run workflow").
name: tidy old failed runs

on:
  push:
    branches: [main]
    paths: [".github/workflows/tidy-runs.yml"]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  tidy:
    runs-on: ubuntu-24.04
    steps:
      - name: delete failed runs that were fixed later
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python3 {0}
        run: |
          import json, os, subprocess

          repo = os.environ["REPO"]
          out = subprocess.run(
              ["gh", "api", "--paginate", f"repos/{repo}/actions/runs?per_page=100", "--jq", ".workflow_runs[]"],
              capture_output=True, text=True, check=True,
          ).stdout
          runs = [json.loads(line) for line in out.splitlines() if line.strip()]
          bad = {"failure", "cancelled", "timed_out", "startup_failure"}
          last_ok = {}
          for r in runs:
              if r.get("conclusion") == "success":
                  key = r["workflow_id"]
                  last_ok[key] = max(last_ok.get(key, ""), r["created_at"])
          gone = 0
          for r in runs:
              if r.get("conclusion") in bad and r["created_at"] < last_ok.get(r["workflow_id"], ""):
                  subprocess.run(["gh", "api", "-X", "DELETE", f"repos/{repo}/actions/runs/{r['id']}"], check=True)
                  print(f"deleted {r['name']} #{r['run_number']} ({r['conclusion']}, {r['created_at']})")
                  gone += 1
          print(f"done: {gone} old run(s) cleared")
