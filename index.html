<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#050806" />
<title>logbook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23050806'/%3E%3Ccircle cx='50' cy='50' r='22' fill='%237ce8a0'/%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #050806; color: #d7f5df; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  #rain { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; opacity: 0.5; pointer-events: none; }
  .scanlines { position: fixed; inset: 0; z-index: 1; pointer-events: none; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.28) 3px); opacity: 0.2; mix-blend-mode: multiply; }
  #boot { position: fixed; inset: 0; z-index: 10; background: #050806; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; font-size: 14px; line-height: 2; transition: opacity 0.5s ease; }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  .cursor-blink { animation: blink 1s step-start infinite; }
  @media (prefers-reduced-motion: reduce) { .cursor-blink { animation: none; opacity: 1; } }
  ::selection { background: #e8b95c; color: #050806; }
  #app { position: relative; z-index: 2; max-width: 680px; margin: 0 auto; padding: 40px 20px 90px; opacity: 0; transition: opacity 0.6s ease; }
  .eyebrow { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #4dd0c4; }
  h1#headerTitle { font-size: 26px; font-weight: 600; margin: 6px 0 22px; color: #eafff2; }
  #storageWarning { display: none; background: rgba(201,106,106,0.12); border: 1px solid rgba(201,106,106,0.4); color: #e3a3a3; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 12px; line-height: 1.6; }
  .verse-box { border: 1px solid rgba(232,185,92,0.3); background: rgba(232,185,92,0.05); border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; }
  .verse-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #b98f4a; margin-bottom: 6px; }
  .verse-text { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 16px; color: #f0d9a8; line-height: 1.5; }
  .verse-ref { font-size: 11px; color: #8a7040; margin-top: 6px; }
  #statsRow { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 14px; }
  .stat-label { font-size: 10px; color: #6b7394; text-transform: uppercase; letter-spacing: 0.1em; }
  .stat-value { font-size: 20px; margin-top: 4px; }
  #statsBars { display: none; font-size: 12px; margin-bottom: 24px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 14px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .bar-label { width: 92px; flex-shrink: 0; }
  .bar-pct { color: #6b7394; margin-left: auto; }
  #weekAgoSection { display: none; cursor: pointer; border: 1px solid rgba(77,208,196,0.3); background: rgba(77,208,196,0.05); border-radius: 10px; padding: 12px 16px; margin-bottom: 24px; }
  .week-ago-text { font-size: 13px; color: #c8c4b8; line-height: 1.5; margin-top: 4px; }
  .form-box { background: #0c1410; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 20px; margin-bottom: 36px; }
  .section-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6b7394; margin-bottom: 14px; }
  .mood-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .mood-btn { flex: 1 1 auto; padding: 10px 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #8890a8; font-family: inherit; font-size: 12px; cursor: pointer; }
  .mood-btn.mood-good.active { border-color: #e8b95c; background: rgba(232,185,92,0.13); color: #e8b95c; }
  .mood-btn.mood-okay.active { border-color: #4dd0c4; background: rgba(77,208,196,0.13); color: #4dd0c4; }
  .mood-btn.mood-rough.active { border-color: #c96a6a; background: rgba(201,106,106,0.13); color: #c96a6a; }
  textarea#entryText { width: 100%; background: #050806; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #eafff2; font-family: inherit; font-size: 14px; line-height: 1.6; padding: 14px; resize: vertical; outline: none; }
  .form-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  #saveStatus { font-size: 11px; color: #5b6482; }
  #saveBtn { padding: 10px 18px; border-radius: 8px; border: none; background: rgba(255,255,255,0.08); color: #5b6482; font-family: inherit; font-size: 12px; font-weight: 700; cursor: not-allowed; }
  #saveBtn.enabled { background: #7ce8a0; color: #052b12; cursor: pointer; }
  #constellation { display: none; flex-wrap: wrap; gap: 9px; padding: 16px 18px; margin-bottom: 24px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; }
  .star { width: 8px; height: 8px; border-radius: 50%; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
  #searchInput { flex: 1 1 160px; background: #0c1410; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #eafff2; font-family: inherit; font-size: 12px; padding: 8px 10px; outline: none; }
  .filter-chip, .tool-btn { padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #6b7394; font-family: inherit; font-size: 11px; cursor: pointer; }
  .filter-chip.chip-good.active { border-color: #e8b95c; background: rgba(232,185,92,0.13); color: #e8b95c; }
  .filter-chip.chip-okay.active { border-color: #4dd0c4; background: rgba(77,208,196,0.13); color: #4dd0c4; }
  .filter-chip.chip-rough.active { border-color: #c96a6a; background: rgba(201,106,106,0.13); color: #c96a6a; }
  #importStatus { font-size: 11px; color: #7ce8a0; min-height: 16px; margin-bottom: 18px; }
  #entriesEmptyMsg { display: none; color: #5b6482; font-size: 13px; font-style: italic; }
  #entriesList { display: flex; flex-direction: column; gap: 10px; }
  .entry-card { background: #0c1410; border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 16px; cursor: pointer; }
  .entry-card-top { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .entry-date { font-size: 12px; color: #8890a8; }
  .entry-status { font-size: 11px; margin-left: auto; }
  .entry-body { margin-top: 8px; color: #c8c4b8; font-size: 13px; line-height: 1.6; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .decrypt-text { white-space: pre-wrap; }
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="scanlines"></div>

<div id="boot"><div id="bootLines"></div></div>

<div id="app">
  <div id="storageWarning"></div>

  <div class="eyebrow">logbook // private</div>
  <h1 id="headerTitle">awaiting first entry</h1>

  <div class="verse-box">
    <div class="verse-label">// message of the day</div>
    <div class="verse-text" id="verseText"></div>
    <div class="verse-ref" id="verseRef"></div>
  </div>

  <div id="statsRow">
    <div class="stat-card">
      <div class="stat-label">uptime</div>
      <div class="stat-value" id="uptimeValue" style="color:#7ce8a0">0 days</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">total entries</div>
      <div class="stat-value" id="totalValue" style="color:#eafff2">0</div>
    </div>
  </div>

  <div id="statsBars"></div>

  <div id="weekAgoSection"></div>

  <div class="form-box">
    <div class="section-label" id="todayDate"></div>
    <div class="mood-row">
      <button class="mood-btn mood-good" data-mood="good">200 · OK</button>
      <button class="mood-btn mood-okay" data-mood="okay">102 · PROCESSING</button>
      <button class="mood-btn mood-rough" data-mood="rough">500 · ERROR</button>
    </div>
    <textarea id="entryText" rows="5" placeholder="&gt; log entry: what happened, what you felt. no need to dress it up."></textarea>
    <div class="form-footer">
      <span id="saveStatus"></span>
      <button id="saveBtn" disabled>commit_entry ▸</button>
    </div>
  </div>

  <div id="constellation"></div>

  <div class="toolbar">
    <input id="searchInput" type="text" placeholder="grep entries..." />
    <button class="filter-chip chip-good" data-status="good">200</button>
    <button class="filter-chip chip-okay" data-status="okay">102</button>
    <button class="filter-chip chip-rough" data-status="rough">500</button>
    <button class="tool-btn" id="exportBtn">↓ export</button>
    <button class="tool-btn" id="importBtn">↑ import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
  </div>
  <div id="importStatus"></div>

  <div class="section-label">past entries</div>
  <div id="entriesEmptyMsg"></div>
  <div id="entriesList"></div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "logbook-entries";

  var STATUS = {
    good: { code: "200", label: "OK", color: "#e8b95c", glow: "rgba(232,185,92,0.55)" },
    okay: { code: "102", label: "PROCESSING", color: "#4dd0c4", glow: "rgba(77,208,196,0.45)" },
    rough: { code: "500", label: "ERROR", color: "#c96a6a", glow: "rgba(201,106,106,0.45)" }
  };

  var VERSES = [
    { text: "Be strong and of a good courage.", ref: "Joshua 1:9" },
    { text: "I can do all things through Christ which strengtheneth me.", ref: "Philippians 4:13" },
    { text: "Trust in the LORD with all thine heart.", ref: "Proverbs 3:5" },
    { text: "Be still, and know that I am God.", ref: "Psalm 46:10" },
    { text: "The LORD is my shepherd; I shall not want.", ref: "Psalm 23:1" },
    { text: "This is the day which the LORD hath made.", ref: "Psalm 118:24" },
    { text: "Fear not: for I am with thee.", ref: "Isaiah 41:10" },
    { text: "Weeping may endure for a night, but joy cometh in the morning.", ref: "Psalm 30:5" },
    { text: "The joy of the LORD is your strength.", ref: "Nehemiah 8:10" },
    { text: "Delight thyself also in the LORD.", ref: "Psalm 37:4" },
    { text: "Cast thy burden upon the LORD.", ref: "Psalm 55:22" },
    { text: "In every thing give thanks.", ref: "1 Thessalonians 5:18" },
    { text: "Let all your things be done with charity.", ref: "1 Corinthians 16:14" },
    { text: "Commit thy works unto the LORD.", ref: "Proverbs 16:3" }
  ];

  var state = { entries: [], mood: null, expandedId: null, query: "", filterStatus: null };

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatDate(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }

  function dayOfYear(d) {
    var start = new Date(d.getFullYear(), 0, 0);
    var diff = d - start;
    return Math.floor(diff / 86400000);
  }

  function bar(pct, width) {
    width = width || 10;
    var filled = Math.max(0, Math.round((pct / 100) * width));
    var empty = Math.max(0, width - filled);
    return "█".repeat(filled) + "░".repeat(empty);
  }

  function calcStreak(entries) {
    if (entries.length === 0) return 0;
    var days = {};
    entries.forEach(function (e) { days[new Date(e.date).toDateString()] = true; });
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    if (!days[d.toDateString()]) { d.setDate(d.getDate() - 1); }
    var streak = 0;
    while (days[d.toDateString()]) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function storageWorks() {
    try {
      var k = "__logbook_test__";
      localStorage.setItem(k, "1");
      var ok = localStorage.getItem(k) === "1";
      localStorage.removeItem(k);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function loadEntries() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveEntries(entries) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      return true;
    } catch (e) {
      return false;
    }
  }

  function renderHeader() {
    var total = state.entries.length;
    document.getElementById("headerTitle").textContent =
      total === 0 ? "awaiting first entry" : total + " " + (total === 1 ? "entry" : "entries") + " logged";
  }

  function renderVerse() {
    var verse = VERSES[dayOfYear(new Date()) % VERSES.length];
    document.getElementById("verseText").textContent = '"' + verse.text + '"';
    document.getElementById("verseRef").textContent = "\u00B7 " + verse.ref;
  }

  function renderStats() {
    var total = state.entries.length;
    var row = document.getElementById("statsRow");
    var bars = document.getElementById("statsBars");
    if (total === 0) {
      row.style.display = "none";
      bars.style.display = "none";
      return;
    }
    row.style.display = "grid";
    bars.style.display = "block";
    var streak = calcStreak(state.entries);
    document.getElementById("uptimeValue").textContent = streak + (streak === 1 ? " day" : " days");
    document.getElementById("totalValue").textContent = String(total);

    var counts = { good: 0, okay: 0, rough: 0 };
    state.entries.forEach(function (e) { if (counts[e.mood] !== undefined) counts[e.mood]++; });

    var html = "";
    Object.keys(STATUS).forEach(function (key) {
      var s = STATUS[key];
      var pct = total ? Math.round((counts[key] / total) * 100) : 0;
      html +=
        '<div class="bar-row" style="color:' + s.color + '">' +
        '<span class="bar-label">' + s.code + " " + s.label + "</span>" +
        "<span>" + bar(pct) + "</span>" +
        '<span class="bar-pct">' + pct + "%</span>" +
        "</div>";
    });
    bars.innerHTML = html;
  }

  function renderConstellation() {
    var el = document.getElementById("constellation");
    if (state.entries.length === 0) {
      el.style.display = "none";
      return;
    }
    el.style.display = "flex";
    var sorted = state.entries.slice().sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
    el.innerHTML = sorted
      .map(function (e) {
        var s = STATUS[e.mood];
        var title = escapeHtml(formatDate(e.date) + " \u00B7 " + s.code);
        return '<div class="star" title="' + title + '" style="background:' + s.color + ";box-shadow:0 0 8px " + s.glow + '"></div>';
      })
      .join("");
  }

  function renderWeekAgo() {
    var el = document.getElementById("weekAgoSection");
    var target = new Date();
    target.setDate(target.getDate() - 7);
    var found = state.entries.find(function (e) { return new Date(e.date).toDateString() === target.toDateString(); });
    if (!found) {
      el.style.display = "none";
      el.innerHTML = "";
      return;
    }
    el.style.display = "block";
    var preview = found.text.length > 90 ? found.text.slice(0, 90) + "\u2026" : found.text;
    el.innerHTML =
      '<div class="verse-label" style="color:#4dd0c4">// one week ago</div>' +
      '<div class="week-ago-text">' + escapeHtml(preview.replace(/\n+/g, " ")) + "</div>";
    el.onclick = function () {
      state.expandedId = found.id;
      renderEntries();
      setTimeout(function () {
        var card = document.querySelector('.entry-card[data-id="' + found.id + '"]');
        if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 50);
    };
  }

  function runDecrypt(id, text) {
    var el = document.getElementById("decrypt-" + id);
    if (!el) return;
    var frame = 0;
    var totalFrames = 12;
    var chars = "01";
    var timer = setInterval(function () {
      frame++;
      if (frame >= totalFrames) {
        el.textContent = text;
        clearInterval(timer);
        return;
      }
      var revealCount = Math.floor((frame / totalFrames) * text.length);
      var out = "";
      for (var i = 0; i < text.length; i++) {
        var c = text[i];
        if (c === "\n" || c === " ") out += c;
        else out += i < revealCount ? c : chars[Math.floor(Math.random() * chars.length)];
      }
      el.textContent = out;
    }, 30);
  }

  function renderEntries() {
    var container = document.getElementById("entriesList");
    var emptyMsg = document.getElementById("entriesEmptyMsg");
    var sorted = state.entries.slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    var q = state.query.trim().toLowerCase();
    var filtered = sorted.filter(function (e) {
      var matchesQuery = q === "" || e.text.toLowerCase().indexOf(q) !== -1;
      var matchesStatus = !state.filterStatus || e.mood === state.filterStatus;
      return matchesQuery && matchesStatus;
    });

    if (state.entries.length === 0) {
      container.innerHTML = "";
      emptyMsg.textContent = "nothing logged yet. the sky is empty. write the first one above.";
      emptyMsg.style.display = "block";
      return;
    }
    if (filtered.length === 0) {
      container.innerHTML = "";
      emptyMsg.textContent = "no entries match that search.";
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    container.innerHTML = filtered
      .map(function (e) {
        var s = STATUS[e.mood];
        var isOpen = state.expandedId === e.id;
        var bodyHtml = isOpen
          ? '<span id="decrypt-' + e.id + '" class="decrypt-text"></span>'
          : '<div class="clamp">' + escapeHtml(e.text.replace(/\n+/g, " ")) + "</div>";
        return (
          '<div class="entry-card" data-id="' + e.id + '">' +
          '<div class="entry-card-top">' +
          '<span class="dot" style="background:' + s.color + ";box-shadow:0 0 6px " + s.glow + '"></span>' +
          '<span class="entry-date">' + formatDate(e.date) + "</span>" +
          '<span class="entry-status" style="color:' + s.color + '">' + s.code + " " + s.label + "</span>" +
          "</div>" +
          '<div class="entry-body">' + bodyHtml + "</div>" +
          "</div>"
        );
      })
      .join("");

    if (state.expandedId) {
      var openEntry = state.entries.find(function (e) { return e.id === state.expandedId; });
      if (openEntry) runDecrypt(openEntry.id, openEntry.text);
    }
  }

  function refreshAll() {
    renderHeader();
    renderStats();
    renderConstellation();
    renderWeekAgo();
    renderEntries();
  }

  function updateSaveButtonState() {
    var btn = document.getElementById("saveBtn");
    var hasText = document.getElementById("entryText").value.trim().length > 0;
    var enabled = !!state.mood && hasText;
    btn.disabled = !enabled;
    btn.classList.toggle("enabled", enabled);
  }

  function handleSave() {
    var textEl = document.getElementById("entryText");
    var textVal = textEl.value.trim();
    if (!state.mood || !textVal) return;
    var entry = { id: Date.now().toString(), date: new Date().toISOString(), mood: state.mood, text: textVal };
    state.entries.unshift(entry);
    var ok = saveEntries(state.entries);
    document.getElementById("saveStatus").textContent = ok ? "" : "write failed, try again";
    textEl.value = "";
    state.mood = null;
    Array.prototype.forEach.call(document.querySelectorAll(".mood-btn"), function (b) { b.classList.remove("active"); });
    updateSaveButtonState();
    refreshAll();
  }

  function handleExport() {
    var payload = JSON.stringify(state.entries, null, 2);
    var blob = new Blob([payload], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "logbook-export-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function showImportStatus(msg) {
    var el = document.getElementById("importStatus");
    el.textContent = msg;
    setTimeout(function () { el.textContent = ""; }, 4000);
  }

  function handleImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("not an array");
        var existingIds = {};
        state.entries.forEach(function (e) { existingIds[e.id] = true; });
        var added = 0;
        parsed.forEach(function (item) {
          if (item && item.id && item.date && item.mood && typeof item.text === "string" && !existingIds[item.id]) {
            state.entries.push(item);
            existingIds[item.id] = true;
            added++;
          }
        });
        saveEntries(state.entries);
        refreshAll();
        showImportStatus("imported " + added + " new entr" + (added === 1 ? "y" : "ies"));
      } catch (e) {
        showImportStatus("import failed: invalid file");
      }
    };
    reader.readAsText(file);
  }

  function startMatrixRain() {
    var canvas = document.getElementById("rain");
    var ctx = canvas.getContext("2d");
    var fontSize = 15;
    var chars = "01";
    var width, height, columns, drops;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.max(1, Math.floor(width / fontSize));
      drops = new Array(columns).fill(0).map(function () { return Math.random() * -40; });
      ctx.fillStyle = "#050806";
      ctx.fillRect(0, 0, width, height);
    }
    resize();
    window.addEventListener("resize", resize);

    var reduceMotion = false;
    try {
      reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) {}

    function frame() {
      ctx.fillStyle = "rgba(3,8,5,0.14)";
      ctx.fillRect(0, 0, width, height);
      ctx.font = fontSize + "px ui-monospace, Menlo, monospace";
      for (var i = 0; i < columns; i++) {
        var char = chars[Math.floor(Math.random() * chars.length)];
        var brightness = Math.random();
        ctx.fillStyle = brightness > 0.96 ? "#c9ffd8" : "rgba(57,255,140," + (0.12 + brightness * 0.35) + ")";
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
        drops[i] += 1;
      }
    }
    if (!reduceMotion) setInterval(frame, 55);
  }

  function startBoot() {
    var bootEl = document.getElementById("boot");
    var container = document.getElementById("bootLines");
    var lines = [
      "> initializing logbook...",
      "> reading local storage...",
      "> user: kaleb",
      "> clearance: personal / eyes only",
      "> entries on record: " + state.entries.length,
      "> access granted."
    ];
    var i = 0;
    var timer = setInterval(function () {
      var line = document.createElement("div");
      line.textContent = lines[i];
      line.style.color = i === lines.length - 1 ? "#e8b95c" : "#7ce8a0";
      container.appendChild(line);
      i++;
      if (i >= lines.length) {
        clearInterval(timer);
        setTimeout(function () {
          bootEl.style.opacity = "0";
          setTimeout(function () { bootEl.style.display = "none"; }, 500);
          document.getElementById("app").style.opacity = "1";
        }, 450);
      }
    }, 200);
  }

  function init() {
    state.entries = loadEntries();

    if (!storageWorks()) {
      var warn = document.getElementById("storageWarning");
      warn.style.display = "block";
      warn.textContent =
        "this browser is not letting the page save local data, so entries will not persist between visits here. " +
        "try opening this file in a different browser (chrome and firefox both work well), or ask claude to help set this up as a hosted page instead.";
    }

    document.getElementById("todayDate").textContent = formatDate(new Date().toISOString());
    renderVerse();
    refreshAll();

    Array.prototype.forEach.call(document.querySelectorAll(".mood-btn"), function (btn) {
      btn.addEventListener("click", function () {
        state.mood = btn.getAttribute("data-mood");
        Array.prototype.forEach.call(document.querySelectorAll(".mood-btn"), function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        updateSaveButtonState();
      });
    });

    document.getElementById("entryText").addEventListener("input", updateSaveButtonState);
    document.getElementById("saveBtn").addEventListener("click", handleSave);

    document.getElementById("searchInput").addEventListener("input", function (e) {
      state.query = e.target.value;
      renderEntries();
    });

    Array.prototype.forEach.call(document.querySelectorAll(".filter-chip"), function (chip) {
      chip.addEventListener("click", function () {
        var s = chip.getAttribute("data-status");
        state.filterStatus = state.filterStatus === s ? null : s;
        Array.prototype.forEach.call(document.querySelectorAll(".filter-chip"), function (c) { c.classList.remove("active"); });
        if (state.filterStatus) chip.classList.add("active");
        renderEntries();
      });
    });

    document.getElementById("exportBtn").addEventListener("click", handleExport);
    document.getElementById("importBtn").addEventListener("click", function () {
      document.getElementById("importFile").click();
    });
    document.getElementById("importFile").addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (file) handleImportFile(file);
      e.target.value = "";
    });

    document.getElementById("entriesList").addEventListener("click", function (e) {
      var card = e.target.closest(".entry-card");
      if (!card) return;
      var id = card.getAttribute("data-id");
      state.expandedId = state.expandedId === id ? null : id;
      renderEntries();
    });

    startMatrixRain();
    startBoot();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
