# Alembic config. The database URL comes from app.config (DATABASE_URL),
# not from this file. The app runs migrations by itself on startup.
#   new migration after changing a model:
#     alembic revision --autogenerate -m "what changed"
#   apply by hand (normally not needed):
#     alembic upgrade head
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
