# Render Blueprint: the Logbook server (API + the app itself) on Render's
# free web service, with the database on Neon (free Postgres that doesn't
# expire). See docs/HOSTING.md.
#
# Render's free instances sleep after 15 idle minutes and take about a
# minute to wake. The app handles that: it waits for the server, and in the
# meantime nothing you type is lost. Open the app from the GitHub Pages
# address (the "front door") and you never see Render's own waking page.
services:
  - type: web
    name: logbook
    runtime: python
    plan: free
    region: frankfurt     # next to the Neon database (Frankfurt) and closest to Addis
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # paste the Neon connection string
        sync: false
      - key: LOGBOOK_PASSWORD      # your (the admin's) password
        sync: false
      - key: LOGBOOK_ADMIN_USERNAME  # your username, e.g. kal
        sync: false
      - key: LOGBOOK_SECRET        # signs login tokens
        generateValue: true
      - key: LOGBOOK_ENVIRONMENT
        value: production
      - key: LOGBOOK_CORS_ORIGINS  # the front door's address, e.g. https://kalebdida.github.io (no path)
        sync: false
      - key: LOGBOOK_AI_PROVIDER   # gemini: free key from https://aistudio.google.com/apikey
        value: gemini
      - key: LOGBOOK_AI_API_KEY    # optional: the Gemini key (or GEMINI_API_KEY), so AI works on every device
        sync: false
